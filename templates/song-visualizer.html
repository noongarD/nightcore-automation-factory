<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightcore Song Visualizer (Full HD)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap');
        @font-face {
            font-family: "Barlow Semi Condensed";
            src: url("fonts/classic/BarlowSemiCondensed-Medium.ttf") format("truetype");
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: "Quicksand";
            src: url("fonts/classic/Quicksand-Variable.ttf") format("truetype");
            font-weight: 300 700;
            font-style: normal;
        }
        @font-face {
            font-family: "Plus Jakarta Sans";
            src: url("fonts/classic/PlusJakartaSans-Variable.ttf") format("truetype");
            font-weight: 200 800;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Oswald', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #canvas {
            background-color: #111;
            z-index: 1;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: opacity 0.3s;
            font-family: Arial, sans-serif;
            width: 300px;
        }

        .controls-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: Arial, sans-serif;
            transition: background 0.3s;
        }

        .tab-btn.active {
            background: #ff3300;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="file"] {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            box-sizing: border-box;
            width: 100%;
        }

        input[type="color"] {
            padding: 0;
            height: 35px;
            cursor: pointer;
            border: 1px solid #444;
            border-radius: 4px;
            width: 100%;
            background: #222;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button.action-btn {
            flex: 1;
            padding: 10px;
            background: #ff3300;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: filter 0.2s;
        }

        button.action-btn:hover { filter: brightness(1.2); }
        button.action-btn:disabled { background: #555 !important; cursor: not-allowed; filter: none; }

        #hide-btn {
            background: #444;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #hide-btn:hover { background: #666; }

        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ff3300;
            z-index: 10;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            display: none;
            font-family: Arial, sans-serif;
        }

        #font-loader {
            position: absolute;
            visibility: hidden;
            font-family: 'Oswald', sans-serif;
        }
    </style>
</head>
<body>
    <div id="font-loader">Oswald Loader</div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="status">🔴 NAGRYWANIE FULL HD...</div>

    <div id="controls">
        <h3 style="margin-top: 0; color: #9e9e9e; font-size: 1.1rem; transition: color 0.5s;" id="menu-title">Ustawienia Visualizer</h3>

        <div class="tabs">
            <button id="tab-vis" class="tab-btn active">Wizualizer</button>
            <button id="tab-thumb" class="tab-btn">Miniaturka</button>
        </div>

        <div class="input-group">
            <label>Kolor Akcentu (Auto / Ręczny)</label>
            <input type="color" id="accent-color-picker" value="#9e9e9e">
        </div>

        <div id="content-vis" class="tab-content active">
            <div class="input-group">
                <label>Tło Główne (Ostra jakość)</label>
                <input type="file" id="image-upload" accept="image/*">
            </div>

            <div class="input-group">
                <label>Audio (MP3/WAV)</label>
                <input type="file" id="audio-upload" accept="audio/*">
            </div>

            <div class="input-group">
                <label for="artist-input">Artysta (miniatura)</label>
                <input type="text" id="artist-input" value="ADITYA SHARMA">
            </div>

            <div class="input-group">
                <label>Tytuł Utworu</label>
                <input type="text" id="title-input" value="BAD IDEA">
            </div>

            <div class="btn-group">
                <button id="play-btn" class="action-btn" disabled>Play</button>
                <button id="record-btn" class="action-btn" disabled>Nagraj Wideo</button>
            </div>
        </div>

        <div id="content-thumb" class="tab-content">
            <div class="input-group">
                <label>Inne Tło (Opcjonalnie)</label>
                <input type="file" id="thumb-image-upload" accept="image/*">
                <small style="color:#777; font-size:0.7rem; margin-top:4px;">Zostaw puste, by użyć tła z wizualizera.</small>
            </div>

            <div class="input-group">
                <label>Artysta (Na miniaturce)</label>
                <input type="text" id="thumb-artist" value="ADITYA SHARMA">
            </div>

            <div class="input-group">
                <label>Tytuł Utworu (Na miniaturce)</label>
                <input type="text" id="thumb-title" value="BAD IDEA">
            </div>

            <button id="download-thumb-btn" class="action-btn" style="width: 100%; margin-top: 10px;">Pobierz Miniaturkę</button>
        </div>

        <button id="hide-btn">Ukryj UI (Spacja)</button>
    </div>

        const spectrumLevels = new Float32Array(spectrumColumns);
        const spectrumBed = new Float32Array(spectrumColumns);
        let bassBed = 0, titlePulse = 0;
        let visualizerPaintCache;
        let filmTitleLayout;
        // Different frequency ranges give each cluster its own motion.
        const spectrumGroups = [
            {end: 0.31, pivot: 0.145, low: 48, high: 4100, gain: 0.218},
            {end: 0.50, pivot: 0.405, low: 111, high: 8200, gain: 0.102},
            {end: 0.69, pivot: 0.595, low: 154, high: 7600, gain: 0.112},
            {end: 1.00, pivot: 0.857, low: 66, high: 4600, gain: 0.205},
        ];
        const spectrumLanes = Array.from({length:spectrumColumns}, (_, i) => {
            const u = (i + 0.5) / spectrumColumns;
            const group = spectrumGroups.findIndex(({end}) => u < end);
            const start = group === 0 ? 0 : spectrumGroups[group-1].end;
            const {end, pivot, low, high, gain} = spectrumGroups[group];
            const extent = u < pivot ? pivot - start : end - pivot;
            const distance = Math.abs(u - pivot) / extent;
            const edgeTaper = Math.min(1, 0.38 + Math.min(u, 1-u) / 0.12);
            return {
                hz: low * (high / low) ** (distance ** 1.22),
                gain: gain * (1 - 0.70 * distance) * edgeTaper,
            };
        });

            const ytH = Math.floor(140 * (512/576));

            // Zamiana wszystkich małych logotypów na piksele
            logosConfig.forEach(logo => {
                const cellH = 160;
                const drawW = cellH * (logo.w / logo.h);
                const finalW = drawW > 220 ? 220 : drawW;
                const finalH = drawW > 220 ? 220 * (logo.h / logo.w) : cellH;

                const c = document.createElement('canvas');
                c.width = finalW;
                c.height = finalH;
                c.getContext('2d').drawImage(logo.img, 0, 0, finalW, finalH);

                logo.rasterized = c; // Cache gotowego obrazka
                logo.finalW = finalW;
                logo.finalH = finalH;
            });
        });

        const artworkOverscan = 1.1;
        const neutralTone = describeRgb(158, 158, 158);
        let artworkPalette = {accent: neutralTone, support: neutralTone};
        let accentGlowColor = "#9e9e9e";
        let thumbAccentColor = accentGlowColor;
        window.__nightcoreArtworkReady = Promise.resolve(false);

        let currentScale = 1.0;
        let currentMode = 'vis';

        let recordStartTime = 0;
        let showIntro = false;

        accentColorPicker.addEventListener('input', (e) => {
            const channels = e.target.value.slice(1).match(/../g).map(channel => parseInt(channel, 16));
            const color = describeRgb(...channels);
            applyArtworkPalette({accent: color, support: color});
        });

        function updateTabColors() {
            tabVis.style.background = tabVis.classList.contains('active') ? accentGlowColor : '#333';
            tabThumb.style.background = tabThumb.classList.contains('active') ? accentGlowColor : '#333';
        }

        tabVis.addEventListener('click', () => {
            currentMode = 'vis';
            tabVis.classList.add('active');
            tabThumb.classList.remove('active');
            contentVis.classList.add('active');
            contentThumb.classList.remove('active');
            updateTabColors();
            if (!isPlaying && !isRecording) drawStaticFrame();
        });

        tabThumb.addEventListener('click', () => {
            currentMode = 'thumb';
            tabThumb.classList.add('active');
            tabVis.classList.remove('active');
            contentThumb.classList.add('active');
            contentVis.classList.remove('active');
            updateTabColors();
            if (!isPlaying && !isRecording) drawStaticFrame();
        });

        artistInput.addEventListener('input', () => {
            thumbArtist.value = artistInput.value;
            if(!isPlaying && currentMode === 'vis') drawStaticFrame();
        });
        titleInput.addEventListener('input', () => {
            thumbTitle.value = titleInput.value;
            if(!isPlaying && currentMode === 'vis') drawStaticFrame();
        });
        thumbArtist.addEventListener('input', () => {
            if(!isPlaying && currentMode === 'thumb') drawStaticFrame();
        });
        thumbTitle.addEventListener('input', () => {
            if(!isPlaying && currentMode === 'thumb') drawStaticFrame();

            canvas.width = frameWidth;
            canvas.height = frameHeight;

            const windowRatio = window.innerWidth / window.innerHeight;
            const targetRatio = frameWidth / frameHeight;

            if (windowRatio < targetRatio) {
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = (window.innerWidth / targetRatio) + 'px';
            } else {
                canvas.style.height = window.innerHeight + 'px';
                canvas.style.width = (window.innerHeight * targetRatio) + 'px';
            }

            if (!isPlaying && !isRecording) drawStaticFrame();
        }
        window.addEventListener('resize', resizeCanvas);

        function describeRgb(r, g, b) {
            const max = Math.max(r, g, b), min = Math.min(r, g, b), range = max - min;
            const light = (max + min) / 510, chroma = range / 255;
            const sector = !range ? 0 : max === r ? (g-b)/range : max === g ? 2+(b-r)/range : 4+(r-g)/range;
            return {
                hue: (sector * 60 + 360) % 360,
                saturation: range ? chroma / (1 - Math.abs(2 * light - 1)) : 0,
                light, chroma, rgb: [r, g, b],
            };
        }

        function artworkRect(image, w, h, overscan) {
            const scale = overscan * Math.max(w / image.naturalWidth, h / image.naturalHeight);
            const iw = image.naturalWidth * scale, ih = image.naturalHeight * scale;
            return [(w - iw) / 2, (h - ih) / 2, iw, ih];
        }

        function extractArtworkPalette(image, overscan = artworkOverscan) {
            const sample = document.createElement('canvas');
            sample.width = portrait ? 54 : 96;
            sample.height = portrait ? 96 : 54;
            const {width: w, height: h} = sample;
            const sampleCtx = sample.getContext('2d');
            sampleCtx.drawImage(image, ...artworkRect(image, w, h, overscan));
            const pixels = sampleCtx.getImageData(0, 0, w, h).data;
            const bins = Array.from({length: 24}, () => ({weight: 0, r: 0, g: 0, b: 0}));
            const wrap = i => (i + bins.length) % bins.length;
            let area = 0;
            for (let y = 0; y < h; y++) {
                const verticalEdge = Math.abs((y + 0.5) * 2 / h - 1) ** 1.8 * 0.52;
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    if (pixels[i+3] < 192) continue;
                    // Favor the environment around the subject, which sits behind the graphics.
                    const horizontalEdge = Math.abs((x + 0.5) * 2 / w - 1) ** 1.45;
                    const position = 0.19 + 0.81 * Math.max(horizontalEdge, verticalEdge);
                    area += position;
                    const r = pixels[i], g = pixels[i+1], b = pixels[i+2];
                    const color = describeRgb(r, g, b);
                    if (color.chroma < 0.045 || color.light < 0.055 || color.light > 0.95) continue;
                    const weight = position * color.chroma ** 1.65 * (0.45 + 0.55 * color.saturation);
                    const bin = bins[wrap(Math.round(color.hue / 15))];
                    bin.weight += weight;
                    bin.r += r * weight;
                    bin.g += g * weight;
                    bin.b += b * weight;
                }
            }
            const blended = bins.map((center, i) => {
                const left = bins[wrap(i-1)], right = bins[wrap(i+1)];
                return Object.fromEntries(['weight', 'r', 'g', 'b'].map(k => [k, center[k] + (left[k] + right[k]) * 0.5]));
            });
            const order = blended.map((bin, i) => i).sort((a, b) => blended[b].weight - blended[a].weight);
            const primary = order[0], strength = blended[primary].weight;
            if (!strength || strength < area * 0.0018) return {accent: neutralTone, support: neutralTone};
            const secondary = order.find(i => {
                const distance = Math.abs(i - primary);
                return Math.min(distance, bins.length - distance) >= 3 && blended[i].weight >= strength * 0.24;
            }) ?? primary;
            const representative = ({weight, r, g, b}) => describeRgb(r/weight, g/weight, b/weight);
            return {accent: representative(blended[primary]), support: representative(blended[secondary])};
        }

        function toneHex({rgb}) {
            return '#' + rgb.map(channel => Math.round(channel).toString(16).padStart(2, '0')).join('');
        }

        function applyArtworkPalette(palette) {
            artworkPalette = palette;
            visualizerPaintCache = null;
            accentGlowColor = toneHex(palette.accent);
            accentColorPicker.value = accentGlowColor;
            menuTitle.style.color = accentGlowColor;
            playBtn.style.background = accentGlowColor;
            recordBtn.style.background = accentGlowColor;
            downloadThumbBtn.style.background = accentGlowColor;
            statusEl.style.color = accentGlowColor;
            updateTabColors();
            if (!isPlaying && !isRecording) drawStaticFrame();
        }

        imageUpload.addEventListener('change', function() {
            if (this.files[0]) {
                const url = URL.createObjectURL(this.files[0]);
                const image = new Image();
                image.src = url;
                const ready = image.decode().then(() => {
                    if (window.__nightcoreArtworkReady !== ready) return false;
                    const palette = extractArtworkPalette(image);
                    bgImgObj = image;
                    blurredArtwork = null;
                    applyArtworkPalette(palette);
                    return true;
                }).catch(error => {
                    console.error('Could not read the background artwork:', error);
                    return false;
                }).finally(() => URL.revokeObjectURL(url));
                window.__nightcoreArtworkReady = ready;
            }
        });

        thumbImageUpload.addEventListener('change', function() {
            if (this.files[0]) {
                const url = URL.createObjectURL(this.files[0]);
                thumbSpecificImgObj.onload = function() {
                    thumbAccentColor = toneHex(extractArtworkPalette(thumbSpecificImgObj, 1).accent);
                    if (!isPlaying && !isRecording) drawStaticFrame();
                };
                thumbSpecificImgObj.src = url;
            } else {
                thumbSpecificImgObj.src = '';

        });

        downloadThumbBtn.addEventListener('click', () => {
            const tCanvas = document.createElement('canvas');

            } else {
                let grad = tCtx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#1a1a2e');
                grad.addColorStop(1, '#16213e');
                tCtx.fillStyle = grad;
                tCtx.fillRect(0, 0, w, h);
            }

            let darkGrad = tCtx.createLinearGradient(0, h * 0.5, 0, h);
            darkGrad.addColorStop(0, 'transparent');
            darkGrad.addColorStop(1, 'rgba(0,0,0,0.85)');
            tCtx.fillStyle = darkGrad;
            tCtx.fillRect(0, h * 0.5, w, h * 0.5);

            let thumbTitleSize = Math.floor(portrait ? w * 0.14 : h * 0.26);
            let thumbArtistSize = Math.floor(portrait ? w * 0.05 : h * 0.05);

            tCtx.textAlign = "center";

            tCtx.fillStyle = "white";
            tCtx.fillText(thumbArtist.value.toUpperCase(), w / 2, bottomMargin - thumbTitleSize - 5, maxTextWidth);

            tCtx.font = `italic 700 ${thumbTitleSize}px 'Oswald', sans-serif`;

            tCtx.shadowOffsetX = 8;
            tCtx.shadowOffsetY = 8;

            tCtx.lineWidth = thumbTitleSize * 0.10;
            tCtx.strokeStyle = currentAccent;
            tCtx.strokeText(thumbTitle.value.toUpperCase(), w / 2, bottomMargin, maxTextWidth);

            tCtx.fillText(thumbTitle.value.toUpperCase(), w / 2, bottomMargin, maxTextWidth);

            const link = document.createElement('a');
            link.download = 'Nightcore_Miniaturka_HD.jpg';
            link.href = tCanvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        function drawArtwork(image, geometry = image) {
            ctx.drawImage(image, ...artworkRect(geometry, canvas.width, canvas.height, artworkOverscan));
        }

        function drawBackground() {
            const image = currentMode === 'thumb' && thumbSpecificImgObj.naturalWidth ? thumbSpecificImgObj : bgImgObj;
            if (image.naturalWidth) return drawArtwork(image);
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#16213e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawBottomShade() {
            const colors = visualizerPaint();
            ctx.fillStyle = currentMode === 'thumb' ? colors.thumbShade : colors.shade;
            ctx.fillRect(0, canvas.height * 0.5, canvas.width, canvas.height * 0.5);
        }

        function applyArtworkCamera(scale, x, y) {
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(scale, scale);
            ctx.translate(-canvas.width / 2 + x, -canvas.height / 2 + y);
        }

        function drawMovingBackground(scale, x, y) {
            ctx.save();
            if (bgImgObj.naturalWidth) applyArtworkCamera(scale, x, y);
            drawBackground();
            ctx.restore();
            // The shading belongs to the screen, not to the moving artwork.
            drawBottomShade();
        }

        function currentLyrics() {
            const input = window.__nightcoreLyrics;
            if (!window.__nightcoreLyricsOptions?.enabled || !Array.isArray(input)) return [];
            if (lyricsInput !== input) {
                lyricsInput = input;
                lyricCues = input.filter(cue => cue && Number.isFinite(cue.start) && Number.isFinite(cue.end)
                    && cue.end > cue.start && typeof cue.text === 'string' && cue.text.trim())
                    .map(({start, end, text}) => ({start, end, text: text.trim()}))
                    .sort((a, b) => a.start - b.start);
                for (let i = 0; i + 1 < lyricCues.length; i++) {
                    lyricCues[i].end = Math.min(lyricCues[i].end, lyricCues[i + 1].start);
                }
            }
            return lyricCues;
        }

        function drawLyricBand(scale = 1, x = 0, y = 0) {
            if (!bgImgObj.naturalWidth) return;
            if (!blurredArtwork) {
                const texture = document.createElement('canvas');
                const ratio = Math.min(1, 720 / Math.max(bgImgObj.naturalWidth, bgImgObj.naturalHeight));
                texture.width = Math.max(1, Math.round(bgImgObj.naturalWidth * ratio));
                texture.height = Math.max(1, Math.round(bgImgObj.naturalHeight * ratio));
                const blurCtx = texture.getContext('2d');
                blurCtx.drawImage(bgImgObj, 0, 0, texture.width, texture.height);
                blurCtx.filter = 'blur(3px)';
                blurCtx.drawImage(bgImgObj, 0, 0, texture.width, texture.height);
                blurredArtwork = texture;
            }
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, canvas.width, lyricBandHeight);
            ctx.clip();
            applyArtworkCamera(scale, x, y);
            drawArtwork(blurredArtwork, bgImgObj);
            ctx.restore();
            const colors = visualizerPaint();
            ctx.fillStyle = colors.lyricTint;
            ctx.fillRect(0, 0, canvas.width, lyricBandHeight);
            ctx.fillStyle = colors.lyricRule;
            ctx.fillRect(0, lyricBandHeight - 1, canvas.width, 1);
        }

        function drawLyrics(cues, time) {
            let lo = 0, hi = cues.length;
            while (lo < hi) {
                const mid = (lo + hi) >>> 1;
                if (cues[mid].start <= time) lo = mid + 1;
                else hi = mid;
            }
            const cue = cues[lo - 1];
            if (!cue || time >= cue.end) return;
            const fade = Math.min(0.20, (cue.end - cue.start) / 3);
            const t = Math.max(0, Math.min(1, (time - cue.start) / fade, (cue.end - time) / fade));
            if (!t) return;
            ctx.save();
            ctx.globalAlpha = t * t * (3 - 2 * t);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#f9fbff';
            ctx.letterSpacing = '0.5px';
            ctx.shadowColor = visualizerPaint().lyricShadow;
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 2;
            const maxWidth = canvas.width * (portrait ? 0.78 : 0.91);
            const centerX = canvas.width * (portrait ? 0.47 : 0.50);
            const font = size => `600 ${size}px "Quicksand", sans-serif`;
            ctx.font = font(55);
            const width = ctx.measureText(cue.text).width;
            if (width * 45 / 55 <= maxWidth) {
                ctx.font = font(Math.min(55, 55 * maxWidth / Math.max(1, width)));
                ctx.fillText(cue.text, centerX, lyricCenter, maxWidth);
            } else {
                ctx.font = font(39);
                const words = cue.text.split(/\s+/);
                let best = null;
                for (let i = 1; i < words.length; i++) {
                    const first = words.slice(0, i).join(' '), second = words.slice(i).join(' ');
                    const widest = Math.max(ctx.measureText(first).width, ctx.measureText(second).width);
                    if (!best || widest < best.widest) best = {first, second, widest};
                }
                if (best) {
                    ctx.fillText(best.first, centerX, lyricCenter - 21, maxWidth);
                    ctx.fillText(best.second, centerX, lyricCenter + 21, maxWidth);
                } else ctx.fillText(cue.text, centerX, lyricCenter, maxWidth);
            }
            ctx.restore();
        }

        function drawFilmTitle(reveal, pulse) {
            const title = titleInput.value.trim().replace(/\s+/g, ' ').toUpperCase();
            if (!title || reveal <= 0) return;
            const w = canvas.width, h = canvas.height, colors = visualizerPaint();
            ctx.save();
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = '0.7px';

            const key = `${w}:${h}:${title}`;
            if (filmTitleLayout?.key !== key) {
                const words = title.match(/^(.+) (\S+)$/u);
                const lead = words ? words[1] : title, tail = words ? words[2] : '';
                const maxWidth = w * (portrait ? 0.72 : 0.76);
                let size = Math.round(portrait ? w * 0.068 : h * 0.0593);
                const measure = () => {
                    ctx.font = `650 ${size}px "Plus Jakarta Sans", sans-serif`;
                    const leadWidth = ctx.measureText(lead).width;
                    const gap = tail ? size * 0.24 : 0;
                    return {leadWidth, gap, width: leadWidth + gap + ctx.measureText(tail).width};
                };
                let layout = measure();
                if (layout.width > maxWidth) {
                    size = Math.max(32, Math.floor(size * maxWidth / layout.width));
                    layout = measure();
                }
                filmTitleLayout = {
                    key, lead, tail, size,
                    font: ctx.font, width: layout.width,
                    tailStart: layout.leadWidth + layout.gap,
                    scaleX: Math.min(1, maxWidth / layout.width),
                };
            }
            const {lead, tail, size, font, width, tailStart, scaleX} = filmTitleLayout;
            ctx.translate(w * (portrait ? 0.47 : 0.5), h * (portrait ? 0.817 : 0.943) + (1 - reveal) * 9);
            ctx.scale(scaleX, 1);
            ctx.globalAlpha *= reveal;
            ctx.font = font;
            const face = ctx.createLinearGradient(0, -size * 0.35, 0, size * 0.35);
            face.addColorStop(0, '#ffffff');
            face.addColorStop(0.55, '#f7f7f7');
            face.addColorStop(1, colors.titleShade);
            ctx.fillStyle = face;
            if (!tail && pulse > 0) {
                ctx.shadowColor = colors.titleGlow(pulse * 0.44);
                ctx.shadowBlur = pulse * 13;
            }
            ctx.fillText(lead, -width / 2, 0);
            if (tail) {
                const x = tailStart - width / 2;
                ctx.fillStyle = colors.titleInside;
                ctx.fillText(tail, x, 0);
                ctx.lineWidth = Math.max(1.6, size * 0.034);
                ctx.lineJoin = 'round';
                ctx.strokeStyle = colors.titleEdge;
                ctx.shadowColor = colors.titleGlow(0.24 + pulse * 0.46);
                ctx.shadowBlur = 6 + pulse * 9;
                ctx.strokeText(tail, x, 0);
            }
            ctx.restore();
        }

        function drawText(reveal = 1, pulse = 0) {
            if (currentMode !== 'thumb') return drawFilmTitle(reveal, pulse);
            const titleSize = Math.floor(portrait ? canvas.width * 0.14 : canvas.height * 0.26);
            const artistSize = Math.floor(portrait ? canvas.width * 0.05 : canvas.height * 0.05);
            const bottom = canvas.height * 0.95, maxWidth = canvas.width * 0.95, center = canvas.width / 2;
            const artist = thumbArtist.value.toUpperCase(), title = thumbTitle.value.toUpperCase();
            const accent = thumbSpecificImgObj.src ? thumbAccentColor : accentGlowColor;
            const artistY = bottom - titleSize - 5;

            ctx.save();
            ctx.textAlign = 'center';
            ctx.lineJoin = 'round';
            ctx.miterLimit = 2;
            ctx.font = `italic 400 ${artistSize}px 'Oswald', sans-serif`;
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;
            ctx.lineWidth = artistSize * 0.20;
            ctx.strokeStyle = 'black';
            ctx.strokeText(artist, center, artistY, maxWidth);
            ctx.shadowColor = 'transparent';
            ctx.lineWidth = artistSize * 0.08;
            ctx.strokeStyle = accent;
            ctx.strokeText(artist, center, artistY, maxWidth);
            ctx.fillStyle = 'white';
            ctx.fillText(artist, center, artistY, maxWidth);

            ctx.font = `italic 700 ${titleSize}px 'Oswald', sans-serif`;
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 8;
            ctx.shadowOffsetY = 8;
            ctx.lineWidth = titleSize * 0.22;
            ctx.strokeStyle = 'black';
            ctx.strokeText(title, center, bottom, maxWidth);
            ctx.shadowColor = 'transparent';
            ctx.lineWidth = titleSize * 0.10;
            ctx.strokeStyle = accent;
            ctx.strokeText(title, center, bottom, maxWidth);
            ctx.fillText(title, center, bottom, maxWidth);
            ctx.restore();
        }

        function visualizerPaint() {
            const w = canvas.width, h = canvas.height;
            const key = `${w}:${h}`;
            if (visualizerPaintCache?.key === key) return visualizerPaintCache;
            const {accent, support} = artworkPalette;
            const reflected = describeRgb(...accent.rgb.map((channel, i) => channel * 0.81 + support.rgb[i] * 0.19));
            // Set contrast separately from hue so dark artwork still produces a readable rim.
            const tone = ({hue, saturation}, light, gain, alpha = 1) => {
                const sat = Math.min(0.94, saturation * gain);
                return `hsl(${Math.round(hue)} ${Math.round(sat * 100)}% ${light * 100}% / ${alpha})`;
            };
            const bottomShade = color => {
                const gradient = ctx.createLinearGradient(0, h * 0.5, 0, h);
                gradient.addColorStop(0, 'transparent');
                gradient.addColorStop(1, color);
                return gradient;
            };
            const ink = ctx.createLinearGradient(0, h * 0.70, 0, h);
            ink.addColorStop(0, tone(accent, 0.145, 0.80, 0.97));
            if (portrait) ink.addColorStop(0.48, tone(accent, 0.092, 0.64, 0.94));
            ink.addColorStop(1, tone(accent, 0.076, 0.58, portrait ? 0.58 : 1));
            const lightX = w * (portrait ? 0.47 : 0.5);
            const lightY = h * (portrait ? 0.93 : 1.12);
            const underlight = ctx.createRadialGradient(lightX, lightY, h * 0.05, lightX, lightY, w * (portrait ? 0.48 : 0.30));
            underlight.addColorStop(0, tone(reflected, 0.32, 0.86, 0.48));
            underlight.addColorStop(0.58, tone(reflected, 0.30, 0.76, 0.21));
            underlight.addColorStop(1, tone(reflected, 0.30, 0.76, 0));
            visualizerPaintCache = {
                key, ink, underlight,
                shade: bottomShade(tone(accent, 0.028, 0.64, 0.85)),
                thumbShade: bottomShade('rgba(0,0,0,0.85)'),
                halo: tone(accent, 0.54, 1.20, 0.46),
                edge: tone(accent, 0.73, 1.16),
                titleShade: tone(reflected, 0.86, 0.60),
                titleInside: tone(accent, 0.55, 0.78, 0.14),
                titleEdge: tone(accent, 0.80, 1.05),
                titleGlow: alpha => tone(accent, 0.61, 1.15, alpha),
                lyricTint: tone(accent, 0.095, 0.70, 0.23),
                lyricRule: tone(accent, 0.74, 0.95, 0.45),
                lyricShadow: tone(accent, 0.04, 0.66, 0.88),
                introGlow: tone(accent, 0.53, 1.16),
                introShade: alpha => tone(accent, 0.046, 0.66, alpha),
            };
            return visualizerPaintCache;
        }

        function drawSpectrum(data, hzToBin = 1) {
            const w = canvas.width, h = canvas.height, column = w / spectrumColumns;
            if (data) {
                for (let i = 0; i < spectrumColumns; i++) {
                    const lane = spectrumLanes[i];
                    const bin = Math.min(data.length - 1, Math.round(lane.hz * hzToBin));
                    const level = Math.max(0, (data[bin] / 255 - 0.22) / 0.78);
                    const onset = Math.max(0, level - spectrumBed[i]);
                    spectrumBed[i] += (level - spectrumBed[i]) * 0.055;
                    const target = Math.min(w, h) * lane.gain * Math.min(1, 0.93 * level ** 2.05 + 0.55 * onset);
                    const response = target > spectrumLevels[i] ? 0.70 : 0.23;
                    spectrumLevels[i] += (target - spectrumLevels[i]) * response;
                }
            }
            const edge = new Path2D();
            const edgeY = portrait ? 0.812 : 0.975;
            const arcDepth = portrait ? 0.058 : 0.102;
            for (let i = 0; i < spectrumColumns; i++) {
                const x = Math.round(i * column), xEnd = Math.round((i + 1) * column);
                const u = (i + 0.5) / spectrumColumns;
                const baseline = h * (edgeY - arcDepth * Math.sin(Math.PI * u) ** 1.56);
                const grouped = spectrumLevels[i] * 0.54 + 0.23 * (
                    spectrumLevels[Math.max(0, i - 1)] + spectrumLevels[Math.min(spectrumColumns - 1, i + 1)]
                );
                const amp = data ? Math.round(grouped / 2) * 2 : 0;
                const y = Math.round(baseline) - amp;
                // Hold the height across the entire column; change it only at the shared boundary.
                if (i === 0) edge.moveTo(x, y);
                else edge.lineTo(x, y);
                edge.lineTo(xEnd, y);
            }
            const base = new Path2D(edge), colors = visualizerPaint();
            base.lineTo(w, h + 1);
            base.lineTo(0, h + 1);
            base.closePath();
            ctx.save();
            ctx.shadowColor = 'transparent';
            ctx.fillStyle = colors.ink;
            ctx.fill(base);
            ctx.fillStyle = colors.underlight;
            ctx.fill(base);
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.strokeStyle = colors.halo;
            ctx.lineWidth = 6;
            ctx.stroke(edge);
            ctx.lineJoin = 'miter';
            ctx.miterLimit = 2;
            ctx.strokeStyle = colors.edge;
            ctx.lineWidth = 2.5;
            ctx.stroke(edge);
            ctx.restore();
        }

        function drawStaticFrame() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowColor = 'transparent';

            drawBackground();
            drawBottomShade();

            if (currentMode === 'vis') {
                if (currentLyrics().length) drawLyricBand();
                drawSpectrum();
            }

            drawText();
        }

        audioUpload.addEventListener('change', function() {
            if (this.files[0]) {
                spectrumLevels.fill(0);
                spectrumBed.fill(0);
                bassBed = 0;
                titlePulse = 0;
                const url = URL.createObjectURL(this.files[0]);
                audio.src = url;
                audio.load();
                playBtn.disabled = false;
                recordBtn.disabled = false;
            }
        });

        hideBtn.addEventListener('click', () => controls.classList.add('controls-hidden'));
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                controls.classList.toggle('controls-hidden');
            }
        });

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.maxDecibels = -18;
                analyser.minDecibels = -88;
                analyser.smoothingTimeConstant = 0.63;
                frequencyData = new Uint8Array(analyser.frequencyBinCount);

                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);

                dest = audioCtx.createMediaStreamDestination();
                analyser.connect(dest);
            }
        }

        playBtn.addEventListener('click', () => {
            if (currentMode === 'thumb') tabVis.click();

            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerText = "Play";
                // Zatrzymujemy poprzednią pętlę animacji, żeby się nie klonowały
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
            } else {
                audio.play();
                isPlaying = true;
                playBtn.innerText = "Pauza";
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                drawVisualizerLoop();
            }
        });

        recordBtn.addEventListener('click', () => {
            if (currentMode === 'thumb') tabVis.click();

            if (isRecording) {
                mediaRecorder.stop();
                recordBtn.innerText = "Nagraj Wideo";
                statusEl.style.display = "none";
                isRecording = false;
            } else {
                initAudio();
                recordedChunks = [];

                const canvasStream = canvas.captureStream(60);
                const audioStream = dest.stream;

                const combinedStream = new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...audioStream.getAudioTracks()
                ]);

                // Pozwalamy przeglądarce samej dobrać najstabilniejszy kodek (bez wymuszania limitów)
                let options = { mimeType: 'video/webm' };
                try {
                    // Próbujemy sprzętowy, jeśli wspierany
                    if (MediaRecorder.isTypeSupported('video/webm; codecs=vp8,opus')) {
                        options = { mimeType: 'video/webm; codecs=vp8,opus', videoBitsPerSecond: 8000000 };
                    }
                    mediaRecorder = new MediaRecorder(combinedStream, options);
                } catch(e) {
                    // Fallback jeśli kodek jest problematyczny na Brave
                    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'syrex_visualizer_fullHD.webm';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                };

                recordStartTime = performance.now();
                // Short clips open on the song excerpt with the visualizer already in view.
                showIntro = !portrait;

                mediaRecorder.start(1000);
                audio.play();
                isPlaying = true;
                playBtn.innerText = "Pauza";

                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                drawVisualizerLoop();

                recordBtn.innerText = "Zatrzymaj Nagrywanie";
                statusEl.style.display = "block";
                controls.classList.add('controls-hidden');
                isRecording = true;
            }
        });

        function drawVisualizerLoop() {
            if (!isPlaying && !isRecording) return;
            // Zabezpieczenie pętli
            animationFrameId = requestAnimationFrame(drawVisualizerLoop);

            analyser.getByteFrequencyData(frequencyData);
            const hzToBin = analyser.fftSize / audioCtx.sampleRate;
            const bassStart = Math.max(1, Math.ceil(44 * hzToBin));
            const bassEnd = Math.max(bassStart, Math.floor(228 * hzToBin));
            let bassSum = 0;
            for (let i = bassStart; i <= bassEnd; i++) bassSum += frequencyData[i];
            const bassAvg = bassSum / (255 * (bassEnd - bassStart + 1));
            const bassHit = Math.min(1, Math.max(0, (bassAvg - bassBed - 0.025) * 5));
            bassBed += (bassAvg - bassBed) * 0.06;
            titlePulse += (bassHit - titlePulse) * (bassHit > titlePulse ? 0.55 : 0.16);

            let targetScale = 1.0 + Math.pow(bassAvg, 4) * 0.02;
            currentScale += (targetScale - currentScale) * 0.4;

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowColor = 'transparent';

            let introBgAlpha = 0;
            let textAlpha = 0;
            let logoAlpha = 0;
            let logoYOffset = 0;
            let currentPhase = 0;

            if (showIntro && isRecording) {
                const elapsedTime = (performance.now() - recordStartTime) / 1000;
                const easeOutCubic = x => 1 - Math.pow(1 - x, 3);

                if (elapsedTime > 8.0) {
                    showIntro = false;
                } else {
                    if (elapsedTime < 0.5) {
                        const p = elapsedTime / 0.5;
                        introBgAlpha = easeOutCubic(p) * 0.45;
                    } else if (elapsedTime < 7.0) {
                        introBgAlpha = 0.45;
                    } else {
                        const p = (elapsedTime - 7.0) / 1.0;
                        const invP = 1 - easeOutCubic(p);
                        introBgAlpha = 0.45 * invP;
                    }

                    if (elapsedTime < 3.5) {
                        currentPhase = 1;
                        if (elapsedTime < 0.5) {
                            const p = elapsedTime / 0.5;
                            textAlpha = easeOutCubic(p);
                            logoYOffset = 50 * (1 - easeOutCubic(p));
                        } else if (elapsedTime < 2.5) {
                            textAlpha = 1;
                            logoYOffset = 0;
                        } else {
                            const p = (elapsedTime - 2.5) / 1.0;
                            const invP = 1 - easeOutCubic(p);
                            textAlpha = invP;
                            logoYOffset = -30 * easeOutCubic(p);
                        }
                    } else {
                        currentPhase = 2;
                        const phase2Time = elapsedTime - 3.5;
                        if (phase2Time < 0.5) {
                            const p = phase2Time / 0.5;
                            textAlpha = easeOutCubic(p);
                            logoAlpha = 0;
                            logoYOffset = 50;
                        } else if (phase2Time < 0.8) {
                            const p = (phase2Time - 0.5) / 0.3;
                            textAlpha = 1;
                            logoAlpha = easeOutCubic(p);
                            logoYOffset = 50 * (1 - easeOutCubic(p));
                        } else if (phase2Time < 2.5) {
                            textAlpha = 1;
                            logoAlpha = 1;
                            logoYOffset = 0;
                        } else {
                            const p = (phase2Time - 2.5) / 1.0;
                            const invP = 1 - easeOutCubic(p);
                            textAlpha = Math.max(0, invP);
                            logoAlpha = Math.max(0, invP);
                            logoYOffset = 0;
                        }
                    }
                }
            }

            const motionTime = performance.now() * 0.001;
            const driftX = Math.sin(motionTime * 0.3) * 7;
            const driftY = Math.cos(motionTime * 0.4) * 4;

            drawMovingBackground(currentScale, driftX, driftY);
            const cues = currentMode === 'vis' ? currentLyrics() : [];
            if (cues.length) drawLyricBand(currentScale, driftX, driftY);

            ctx.filter = 'none';

            drawSpectrum(frequencyData, hzToBin);
            const titleIn = Math.min(1, Math.max(0, (audio.currentTime - 0.08) / 0.64));
            drawText(1 - (1 - titleIn) ** 3, titlePulse);

            if (showIntro && isRecording) {
                ctx.save();
                const colors = visualizerPaint();

                if (introBgAlpha > 0) {
                    ctx.fillStyle = colors.introShade(introBgAlpha);
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

              if (currentPhase === 1) {
                    if (textAlpha > 0) {
                        ctx.globalAlpha = textAlpha;
                        ctx.textAlign = "center";

                        const centerY = canvas.height / 2 + logoYOffset;

                        // Używamy zrasteryzowanego YT zamiast czystego SVG
                        if (ytWhiteRasterized) {
                            ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                            ctx.shadowBlur = 20;
                            ctx.drawImage(ytWhiteRasterized, canvas.width / 2 - ytWhiteRasterized.width / 2, centerY - 230, ytWhiteRasterized.width, ytWhiteRasterized.height);
                        }

                        ctx.fillStyle = "white";
                        ctx.letterSpacing = '4px';
                        ctx.font = '500 120px "Barlow Semi Condensed", sans-serif';
                        ctx.shadowColor = colors.introGlow;
                        ctx.shadowBlur = 40;
                        ctx.fillText("SUBSCRIBE", canvas.width / 2, centerY + 30);

                        ctx.font = '500 45px "Barlow Semi Condensed", sans-serif';
                        ctx.shadowBlur = 10;
                        ctx.fillText("TO THE CHANNEL", canvas.width / 2, centerY + 110);
                    }
                }
                else if (currentPhase === 2) {
                    const cols = 3;
                    const rows = 2;
                    const cellW = 160;
                    const cellH = 160;
                    const gapX = 140;
                    const gapY = 80;

                    const totalW = (cols * cellW) + ((cols - 1) * gapX);
                    const totalH = (rows * cellH) + ((rows - 1) * gapY);

                    const startX = (canvas.width - totalW) / 2;
                    const startY = (canvas.height - totalH) / 2 + logoYOffset + 60;

                    if (textAlpha > 0) {
                        ctx.globalAlpha = textAlpha;
                        ctx.textAlign = "center";
                        ctx.fillStyle = "white";
                        ctx.letterSpacing = '4px';
                        ctx.font = '500 100px "Barlow Semi Condensed", sans-serif';
                        ctx.shadowColor = colors.introGlow;
                        ctx.shadowBlur = 30;
                        ctx.fillText("LISTEN ON", canvas.width / 2, startY - 80);
                    }

                    if (logoAlpha > 0) {
                        ctx.globalAlpha = logoAlpha;
                        ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                        ctx.shadowBlur = 15;

                        logosConfig.forEach((logo, i) => {
                            if (!logo.rasterized) return; // Zabezpieczenie przed błędem renderowania

                            const col = i % cols;
                            const row = Math.floor(i / cols);

                            const cellCenterX = startX + col * (cellW + gapX) + cellW / 2;
                            const cellCenterY = startY + row * (cellH + gapY) + cellH / 2;

                            // Rysujemy wcześniej zrasteryzowaną, tanią w obliczeniach bitmapę
                            ctx.drawImage(
                                logo.rasterized,
                                cellCenterX - logo.finalW / 2,
                                cellCenterY - logo.finalH / 2 + logo.offsetY,
                                logo.finalW,
                                logo.finalH
                            );
                        });
                    }
                }
                ctx.restore();
            }
            if (cues.length) drawLyrics(cues, audio.currentTime);
        }

        updateTabColors();
        resizeCanvas();
        window.__nightcoreFontsReady.then(() => {
            filmTitleLayout = null;
            if (!isPlaying && !isRecording) drawStaticFrame();
        });
    </script>
</body>
